name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Typecheck, test, and build
        run: npm run ci
      - name: Write placeholder config and service-worker version
        run: node scripts/generate-config.mjs
