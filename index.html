<!DOCTYPE html>

<meta charset="UTF-8">
<script>
(function(){
  try{
    var p=localStorage.getItem('operate.appearance');
    var light=false;
    if(p==='light') light=true;
    else if(p==='dark') light=false;
    else if(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches) light=true;
    document.documentElement.setAttribute('data-theme',light?'light':'dark');
    document.documentElement.style.colorScheme=light?'light':'dark';
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content',light?'#F7F7FA':'#0a0a0c');
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>

  (function startOperate(){
    try{
      if(typeof authBoot === 'function') authBoot();
    }catch(e){
      console.error('[Operate] start failed', e);
      var v=document.getElementById('view');
      if(v) v.innerHTML='<div class="card" style="margin:24px;padding:16px"><b>Could not start</b><p class="hint">Try a hard refresh (clear cache). If it keeps happening, run <code>operateErrors()</code> in the browser console.</p></div>';
    }
  })();
  window.addEventListener('pageshow', function(ev){
    if(!ev.persisted) return;
    try{ if(typeof boot === 'function') boot(); }catch(_){}
    try{
      if(typeof OperateReact !== 'undefined' && OperateReact.mountApp) OperateReact.mountApp();
    }catch(_){}
  });
